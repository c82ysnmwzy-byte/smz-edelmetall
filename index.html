<header><h1><b>SMZ</b> Edelmetall</h1></header><main id="v" tabindex="-1"></main><nav id="nav" aria-label="Hauptnavigation"></nav><div id="toast" role="status" aria-live="polite"></div>
<script>/* SMZ Edelmetall – mathematischer Kern V1 (Phase B). Keine UI, keine Netzwerkzugriffe. */
(function (root) {
  'use strict';
  const G_PER_OZ = 31.1034768, G_PER_KG = 1000, G_PER_T = 1e6, G_PER_LB = 453.59237;
  const UNIT_G = { g: 1, kg: G_PER_KG, oz: G_PER_OZ, t: G_PER_T, lb: G_PER_LB };
  const clamp = x => Math.min(1, Math.max(0, x));
  const toGrams = (v, u) => { if (!(u in UNIT_G)) throw new Error('Unbekannte Einheit: ' + u); return v * UNIT_G[u]; };
  const pricePerGram = (price, unit) => price / UNIT_G[unit];
  // Quotierung: USD je EUR  =>  EUR = USD / (USD je EUR)
  const usdToEur = (usd, usdPerEur) => { if (!(usdPerEur > 0)) throw new Error('Ungültiger FX'); return usd / usdPerEur; };

  // Midrank-Perzentil (0..1): (#kleiner + 0,5·#gleich)/N
  function midrank(series, x) {
    let lt = 0, eq = 0;
    for (const v of series) { if (v < x) lt++; else if (v === x) eq++; }
    return (lt + 0.5 * eq) / series.length;
  }
  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
  const ma = (a, n) => a.length >= n ? mean(a.slice(-n)) : null;

  // Gold-Silber-Ratio; Paare nur bei gleicher Währung und Zeitabweichung <= maxMs
  function ratio(gold, silver, maxMs = 36e5) {
    if (gold.currency !== silver.currency) return { value: null, reason: 'Währungen verschieden' };
    if (Math.abs(gold.asOf - silver.asOf) > maxMs) return { value: null, reason: 'Kurse nicht synchron' };
    return { value: gold.pricePerOz / silver.pricePerOz };
  }
  const ratioDeviation = (r, avg) => (r / avg - 1);
  function ratioCategory(pct, nPairs, coverage) {
    if (nPairs < 250 || coverage < 0.8) return null;
    const p = pct * 100;
    if (p < 20) return 'Gold deutlich relativ günstiger';
    if (p < 40) return 'Gold relativ günstiger';
    if (p <= 60) return 'Historisch eher neutral';
    if (p <= 80) return 'Silber relativ günstiger';
    return 'Silber deutlich relativ günstiger';
  }

  // Scorefaktoren (K = Kauf, V = 100-K, außer Perzentil/Kosten wie im Pflichtenheft 2.2)
  const W = { pct: .30, ma: .20, range: .15, fx: .10, mom: .15, cost: .10 };
  function scores(o) {
    // o: {prices[], fxSeries[]|null, currency:'EUR'|'USD', buyPremium|null, sellDiscount|null, stale}
    const p = o.prices, cur = p[p.length - 1], f = {}, why = [];
    if (o.stale) return { total: null, reason: 'Kurs veraltet' };
    const P = midrank(p, cur);
    const ma50 = ma(p, 50), ma200 = ma(p, 200);
    const mn = Math.min(...p), mx = Math.max(...p);
    const r = n => p.length > n ? cur / p[p.length - 1 - n] - 1 : null;
    const r21 = r(21), r126 = r(126);
    f.pct = { K: 100 * (1 - P), V: 100 * P };
    if (ma50 !== null && ma200 !== null) { const k = 50 - 25 * Math.tanh((cur / ma50 - 1) / .10) - 25 * Math.tanh((cur / ma200 - 1) / .20); f.ma = { K: k, V: 100 - k }; }
    { const k = mx === mn ? 50 : 100 * clamp(1 - (cur - mn) / (mx - mn)); f.range = { K: k, V: 100 - k }; if (mx === mn) why.push('Hoch=Tief: neutral'); }
    if (o.currency === 'EUR' && o.fxSeries) { const k = 100 * midrank(o.fxSeries, o.fxSeries[o.fxSeries.length - 1]); f.fx = { K: k, V: 100 - k }; }
    else if (o.currency === 'USD') f.fx = { K: 50, V: 50 };
    if (r21 !== null && r126 !== null) { const k = 50 - 25 * Math.tanh(r21 / .10) - 25 * Math.tanh(r126 / .25); f.mom = { K: k, V: 100 - k }; }
    if (o.buyPremium != null && o.sellDiscount != null) f.cost = { K: 100 * clamp(1 - Math.max(0, o.buyPremium) / .30), V: 100 * clamp(1 - Math.max(0, o.sellDiscount) / .30) };
    const must = ['pct', 'ma', 'range', 'mom'].filter(k => !f[k]);
    const wSum = Object.keys(f).reduce((s, k) => s + W[k], 0);
    if (must.length || wSum < .8) return { total: null, factors: f, reason: 'Pflichtfaktoren fehlen: ' + must.join(',') };
    let K = 0, V = 0, w = {};
    for (const k in f) { K += W[k] * f[k].K; V += W[k] * f[k].V; w[k] = W[k] / wSum; }
    return { total: { K: K / wSum, V: V / wSum }, factors: f, weights: w, notes: why };
  }

  // Lots: Integer-Cent-Kostenbasis, Gramm mit 8 Nachkommastellen; Restbestand-Reste gehen auf die letzte Buchung
  const q8 = x => Math.round(x * 1e8) / 1e8;
  function newLot(id, depot, metal, grossG, fineness, costCents, date) {
    const fine = q8(grossG * fineness);
    return { id, depot, metal, fine, costCents, date, origin: id, sold: [], };
  }
  function sell(lot, soldFine, netProceedsCents) {
    if (soldFine > lot.fine + 1e-9) throw new Error('Verkauf über Restbestand');
    const full = Math.abs(soldFine - lot.fine) < 1e-9;
    const alloc = full ? lot.costCents : Math.round(lot.costCents * (soldFine / lot.fine));
    lot.fine = full ? 0 : q8(lot.fine - soldFine);
    lot.costCents -= alloc;
    return { allocCostCents: alloc, realizedCents: netProceedsCents - alloc };
  }
  function transfer(lot, fineG, toDepot, newId) {
    if (fineG > lot.fine + 1e-9) throw new Error('Transfer über Restbestand');
    const full = Math.abs(fineG - lot.fine) < 1e-9;
    const cost = full ? lot.costCents : Math.round(lot.costCents * (fineG / lot.fine));
    const moved = { ...lot, id: newId, depot: toDepot, fine: q8(fineG), costCents: cost, sold: [] }; // origin/date erhalten
    lot.fine = full ? 0 : q8(lot.fine - fineG); lot.costCents -= cost;
    return moved;
  }

  // Simulator: Attribution Metall → FX → Kosten (Summe = Gesamtergebnis)
  function simulate(s) {
    // s: fineG, buySpotUsd/g(inkl. nichts), buyFx, buyPremium, buyFixedEur, sellSpotUsd/g, sellFx, sellDiscount, sellFeeEur, inflation, years
    const buyUsd = s.fineG * s.buySpotUsdG, buyEurRef = usdToEur(buyUsd, s.buyFx);
    const buyTotal = buyEurRef * (1 + s.buyPremium) + s.buyFixedEur;
    const sellGrossEur = usdToEur(s.fineG * s.sellSpotUsdG * (1 - s.sellDiscount), s.sellFx);
    const sellNet = sellGrossEur - s.sellFeeEur;
    const profit = sellNet - buyTotal, ret = buyTotal > 0 ? profit / buyTotal : null;
    const metalEffect = usdToEur(s.fineG * s.sellSpotUsdG, s.buyFx) - buyEurRef;
    const fxEffect = usdToEur(s.fineG * s.sellSpotUsdG, s.sellFx) - usdToEur(s.fineG * s.sellSpotUsdG, s.buyFx);
    const costEffect = profit - metalEffect - fxEffect; // alle Kosten/Abschläge, Rest exakt
    const real = ret === null || s.inflation <= -1 ? null : (1 + ret) / Math.pow(1 + s.inflation, s.years) - 1;
    // Break-even-Spot (USD/g): sellNet = buyTotal
    const be = ((buyTotal + s.sellFeeEur) * s.sellFx) / (s.fineG * (1 - s.sellDiscount));
    return { buyTotal, sellNet, profit, ret, real, attribution: { metalEffect, fxEffect, costEffect }, breakEvenSpotUsdG: be, warnNegative: sellNet < 0 };
  }

  // Alarm-Zustandsautomat (Schwelle über/unter), einmalig pro beobachtetem Übertritt
  function makeAlarm(dir, threshold) { return { dir, threshold, state: 'init', last: null }; }
  function alarmStep(a, value, stale) {
    if (stale || value == null) return false;
    const cond = a.dir === 'above' ? value > a.threshold : value < a.threshold;
    let fired = false;
    if (a.state === 'init') a.state = cond ? 'ausgelöst-initial' : 'scharf'; // kein Trigger beim Erstellen
    else if (a.state === 'scharf' && cond) { a.state = 'ausgelöst'; fired = true; }
    else if ((a.state === 'ausgelöst' || a.state === 'ausgelöst-initial') && !cond) a.state = 'scharf';
    return fired;
  }


  // ---------- Phase B2: Datenqualität, Paarung, Mindestdaten, TWR, 24h-Fenster ----------
  // Serien: [{date:'YYYY-MM-DD', v:Number, quoteType?:String}] – nur echte Beobachtungen, nie interpoliert.
  const isWeekend = d => { const w = new Date(d + 'T00:00:00Z').getUTCDay(); return w === 0 || w === 6; };
  // Referenz-Handelstage = Vereinigung der Datumswerte geprüfter Serien ohne Wochenenden (Feiertage: nur was Quellen liefern)
  function referenceDays(...seriesList) {
    const set = new Set();
    for (const s of seriesList) for (const o of s) if (!isWeekend(o.date)) set.add(o.date);
    return [...set].sort();
  }
  function windowSeries(series, endDate, years) {
    const e = new Date(endDate + 'T00:00:00Z'); const st = new Date(e); st.setUTCFullYear(e.getUTCFullYear() - years);
    const a = st.toISOString().slice(0, 10);
    return series.filter(o => o.date > a && o.date <= endDate);
  }
  // Lücken: Wochentage ohne Beobachtung zwischen erstem und letztem Datum (werden gemeldet, nie gefüllt)
  function findGaps(series) {
    if (series.length < 2) return [];
    const have = new Set(series.map(o => o.date)), out = [];
    const d = new Date(series[0].date + 'T00:00:00Z'), end = new Date(series[series.length - 1].date + 'T00:00:00Z');
    for (; d <= end; d.setUTCDate(d.getUTCDate() + 1)) { const k = d.toISOString().slice(0, 10); if (!isWeekend(k) && !have.has(k)) out.push(k); }
    return out;
  }
  function pairSeries(a, b) {
    const mb = new Map(b.map(o => [o.date, o.v])), out = [];
    for (const o of a) if (mb.has(o.date)) out.push({ date: o.date, a: o.v, b: mb.get(o.date) });
    return out;
  }
  // Sprünge markieren, NICHT löschen
  function flagJumps(series, thr = 0.2) {
    const f = []; for (let i = 1; i < series.length; i++) { const r = series[i].v / series[i - 1].v - 1; if (Math.abs(r) > thr) f.push({ date: series[i].date, change: r }); } return f;
  }
  function checkMinData(series, refDays, opt = {}) {
    const minN = opt.minN || 252, minCov = opt.minCov || 0.8;
    const ref = new Set(refDays), n = series.length;
    const hit = series.filter(o => ref.has(o.date)).length;
    const coverage = refDays.length ? hit / refDays.length : 0;
    const types = new Set(series.map(o => o.quoteType || 'unbekannt'));
    const reasons = [];
    if (n < minN) reasons.push(`Nur ${n} gültige Tageswerte (min. ${minN})`);
    if (coverage < minCov) reasons.push(`Abdeckung ${(coverage * 100).toFixed(1)} % (min. ${minCov * 100} %)`);
    if (types.size > 1) reasons.push('Vermischte Kursarten: ' + [...types].join(', '));
    return { ok: reasons.length === 0, n, coverage, reasons };
  }
  // Gesamtscore aus datierten Serien (EUR: FX nur auf gemeinsamen Tagen, sonst Sperre)
  function scoreSeries(o) {
    const q = checkMinData(o.series, o.refDays, o.opt);
    if (!q.ok) return { total: null, reason: q.reasons.join('; '), quality: q };
    let fxVals = null;
    if (o.currency === 'EUR') {
      if (!o.fxSeries) return { total: null, reason: 'FX-Reihe fehlt', quality: q };
      const pr = pairSeries(o.series, o.fxSeries);
      if (pr.length / o.series.length < 0.8) return { total: null, reason: 'FX nicht synchron zu Metallreihe', quality: q };
      fxVals = pr.map(x => x.b);
    }
    const r = scores({ prices: o.series.map(x => x.v), fxSeries: fxVals, currency: o.currency, buyPremium: o.buyPremium, sellDiscount: o.sellDiscount, stale: o.stale });
    r.quality = q; return r;
  }
  // TWR: periods = [{vStart (nach vorherigem Cashflow), vEnd (vor nächstem Cashflow)}]; fehlt eine Grenzbewertung -> nicht berechenbar
  function twr(periods) {
    if (!periods || !periods.length) return { value: null, reason: 'nicht berechenbar: keine Teilperioden' };
    let prod = 1;
    for (const p of periods) {
      if (!Number.isFinite(p.vStart) || !Number.isFinite(p.vEnd) || p.vStart <= 0) return { value: null, reason: 'nicht berechenbar: Grenzbewertung fehlt' };
      prod *= p.vEnd / p.vStart;
    }
    return { value: prod - 1 };
  }
  // 24h-Änderung nur mit zeitlich passendem Vergleichskurs (Toleranz tolMs um now-24h)
  function change24h(hist, nowMs, price, tolMs = 3 * 36e5) {
    const target = nowMs - 864e5; let best = null;
    for (const h of hist) { const d = Math.abs(h.t - target); if (d <= tolMs && (!best || d < best.d)) best = { d, v: h.v }; }
    return best ? price / best.v - 1 : null;
  }


  // ---------- Chart-Datenaufbereitung (Phase C2) ----------
  const PERIOD_DAYS = { '1D': 1, '1W': 7, '1M': 30, '3M': 91, '6M': 182, '1Y': 365, '3Y': 1095, '5Y': 1825, '10Y': 3650, '20Y': 7300, Max: Infinity };
  const dayNum = d => Date.parse(d + 'T00:00:00Z') / 864e5;
  function medianGapDays(rows) { if (rows.length < 2) return null; const g = []; for (let i = 1; i < rows.length; i++) g.push(dayNum(rows[i].date) - dayNum(rows[i - 1].date)); g.sort((a, b) => a - b); return g[g.length >> 1]; }
  function periodWindow(rows, p) { if (!rows.length || p === 'Max') return rows; const e = dayNum(rows[rows.length - 1].date) - PERIOD_DAYS[p]; return rows.filter(r => dayNum(r.date) >= e); }
  function periodAvail(rows, p) {
    if (rows.length < 2) return { ok: false, why: 'zu wenige Daten' };
    if (p === '1D') return { ok: false, why: 'keine Intraday-Daten (nur Tageswerte)' };
    if (p === 'Max') return { ok: true };
    const span = dayNum(rows[rows.length - 1].date) - dayNum(rows[0].date);
    return span >= PERIOD_DAYS[p] * 0.9 ? { ok: true } : { ok: false, why: 'Daten erst ab ' + rows[0].date + ' (' + Math.round(span) + ' Tage)' };
  }
  // Nur gemeinsame Datumswerte (kein Auffüllen)
  function intersectSeries(lists, key = r => r.date) {
    if (!lists.length || lists.some(l => !l.length)) return { lists: lists.map(() => []), common: 0 };
    const sets = lists.map(l => new Set(l.map(key))), cs = new Set(lists[0].filter(r => sets.every(s => s.has(key(r)))).map(key));
    return { lists: lists.map(l => l.filter(r => cs.has(key(r)))), common: cs.size };
  }
  // Tatsächliche Datenauflösung aus Zeitstempeln (rows mit t in ms, aufsteigend)
  function resInfo(rows) {
    if (rows.length < 2) return { n: rows.length, medGapDays: null, grain: 'unbekannt', weekend: 0, weekendShare: 0, maxGapDays: null };
    const g = []; let we = 0;
    for (let i = 0; i < rows.length; i++) { if (i) g.push((rows[i].t - rows[i - 1].t) / 864e5); const w = new Date(rows[i].t).getUTCDay(); if (w === 0 || w === 6) we++; }
    g.sort((a, b) => a - b); const med = g[g.length >> 1];
    const grain = med < 0.5 ? 'intraday' : med <= 1.5 ? 'täglich' : med <= 4.5 ? 'ausgedünnt (~' + Math.round(med) + ' Tage)' : med <= 10 ? 'wöchentlich' : 'monatlich oder gröber';
    return { n: rows.length, medGapDays: med, grain, weekend: we, weekendShare: we / rows.length, maxGapDays: g[g.length - 1] };
  }
  const indexSeries = rows => rows.length && rows[0].v > 0 ? rows.map(r => ({ date: r.date, v: r.v * 100 / rows[0].v })) : [];
  const ratioSeries = (a, b) => pairSeries(a, b).filter(p => p.b > 0).map(p => ({ date: p.date, v: p.a / p.b }));
  const gapLimitDays = rows => Math.max(10, 5 * (medianGapDays(rows) || 1));
  function seriesStats(vals, cur) { const n = vals.length, mean = vals.reduce((s, v) => s + v, 0) / n; return { n, mean, min: Math.min(...vals), max: Math.max(...vals), cur, pct: midrank(vals, cur) }; }

  const api = { resInfo, PERIOD_DAYS, dayNum, medianGapDays, periodWindow, periodAvail, intersectSeries, indexSeries, ratioSeries, gapLimitDays, seriesStats, referenceDays, windowSeries, findGaps, pairSeries, flagJumps, checkMinData, scoreSeries, twr, change24h, isWeekend, G_PER_OZ, G_PER_KG, G_PER_T, G_PER_LB, toGrams, pricePerGram, usdToEur, midrank, ma, ratio, ratioDeviation, ratioCategory, scores, newLot, sell, transfer, simulate, makeAlarm, alarmStep, W };
  if (typeof module !== 'undefined') module.exports = api; else root.SMZCore = api;
})(typeof self !== 'undefined' ? self : this);
</script><script>/* SMZ Edelmetall – Datenadapter (Phase A). Alle Provider-Mappings sind UNGEPRÜFT, bis probe-sources.mjs / die In-App-Prüfung
   echte Antworten bestätigt hat. Ohne gültiges Mapping liefert der Adapter einen Fehler statt Werte zu raten. */
(function (root) {
  'use strict';
  const get = (o, path) => path.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o);
  const ERR = { OFFLINE: 'offline', CORS: 'cors_oder_netz', RATE: 'rate_limit', KEY: 'api_key_ungueltig', HTTP: 'http_fehler', INCOMPAT: 'quelle_inkompatibel', NOCFG: 'nicht_konfiguriert', BACKOFF: 'backoff' };

const due=(k,ms,force)=>force||!(S.srcst[k]&&S.srcst[k].okAt&&Date.now()-S.srcst[k].okAt<ms);
function st(k,o){S.srcst[k]=Object.assign(S.srcst[k]||{},{at:Date.now(),msg:'',raw:undefined},o)}

function layerUrl(sym,r){const b=SRC['standard-bullion'].baseUrl+'?metal='+sym;if(r==='3y'||r==='20y'){const e=new Date(),a=new Date(e);a.setUTCFullYear(e.getUTCFullYear()-(r==='3y'?3:20));return b+'&start_date='+a.toISOString().slice(0,10)+'&end_date='+e.toISOString().slice(0,10)}return b+'&range='+r}
async function sbFetch(id,r,force){const sym=SBSYM[id],key='sb:'+id+':'+r,old=(S.hl[id]||{})[r];if(!force&&old&&Date.now()-old.fetchedAt<LAYER_IVL[r])return 0;
 const res=await F.fetchJson(key,layerUrl(sym,r),{force});
 if(!res.ok){if(res.error==='backoff')return 0;st(key,{state:'fehler',msg:res.error+(res.detail?' – '+res.detail:'')});return-1}
 const raw=JSON.stringify(res.json,(k,v)=>k==='points'&&Array.isArray(v)?v.slice(0,2):v).slice(0,300),p=A.parseStandardBullion(res.json,sym);
 if(!p.ok){st(key,{state:'abgelehnt',msg:p.detail,raw});return-1}
 const rowsL=p.rows.map(x=>({date:x.date,t:x.t,iso:x.iso,v:x.usdOz/C.G_PER_OZ})),ri=C.resInfo(rowsL);
 (S.hl[id]=S.hl[id]||{})[r]={rows:rowsL,res:ri,fetchedAt:Date.now(),src:'Standard Bullion',unit:p.unit,claimed:p.claimedGrain,dup:p.dup,rejected:p.rejected,first:rowsL[0].date,last:rowsL[rowsL.length-1].date};hlDirty=true;
 st(key,{state:'ok',okAt:Date.now(),msg:`${rowsL.length} Punkte · ${ri.grain}`,raw});return 1}
async function ensureLayer(id,p){loadingSet.add(id);try{for(const r of PER_LAYERS[p]){if(await sbFetch(id,r,false)>=0)return true}return false}finally{loadingSet.delete(id)}}

async function tsyFetch(k,tpl,col,target,name,force){if(!due(k,216e5,force))return[0,null];const Y=new Date().getFullYear();let p=null,txt='',le='';
 for(const y of [Y,Y-1]){const r=await F.fetchJson(k+y,tpl.replace(/\{Y\}/g,y),{text:true,force});if(!r.ok){le=r.error+(r.detail?' – '+r.detail:'');if(r.error==='backoff')break;continue}txt=r.text;p=A.parseTreasuryCsv(txt,col);if(p.ok&&(p.n>1||y===Y-1))break}
 if(p&&p.ok){S.rates[target]={v:p.v,date:p.date,prev:p.prev,prevDate:p.prevDate,m1:p.m1,src:name,fetchedAt:Date.now(),unit:'% p. a.'};st(k,{state:'ok',okAt:Date.now(),raw:txt.slice(0,300)});return[1,null]}
 if(p){st(k,{state:'abgelehnt',msg:p.detail,raw:txt.slice(0,300)});return[0,k]}
 if(le&&!le.startsWith('backoff')){st(k,{state:'fehler',msg:le});return[0,k]}return[0,null]}
async function fedFetch(force){if(!due('fed',216e5,force))return[0,null];let last=null;
 for(const u of SRC.nyfed.urls){const r=await F.fetchJson('fed'+u.length,u,{force});if(!r.ok){if(r.error==='backoff')return[0,null];last={state:'fehler',msg:r.error+(r.detail?' – '+r.detail:'')};continue}
  const raw=JSON.stringify(r.json).slice(0,300),p=A.parseNyFedTarget(r.json);if(!p.ok){last={state:'abgelehnt',msg:p.detail,raw};continue}
  S.rates.fed={from:p.from,to:p.to,date:p.date,prev:p.prev,windowStart:p.windowStart,src:'NY Fed (EFFR-API, Zielband)',fetchedAt:Date.now(),unit:'% p. a.'};st('fed',{state:'ok',okAt:Date.now(),raw});return[1,null]}
 st('fed',last||{state:'fehler',msg:'keine Antwort'});return[0,'Fed-Zielband']}
async function fxhFetch(force){if(!due('fxh',864e5,force))return[0,null];const o=S.ser.fx;let from=o&&o.rows.length?o.rows[o.rows.length-1].date:'1999-01-04';const to=today();let n=0,tot=0,lastErr=null;
 while(from<=to&&n<10){n++;const e=new Date(from+'T00:00:00Z');e.setUTCFullYear(e.getUTCFullYear()+4);const end=e.toISOString().slice(0,10)<to?e.toISOString().slice(0,10):to;
  const r=await F.fetchJson('fxh'+from,SRC['frankfurter-v2'].histUrl.replace('{FROM}',from).replace('{TO}',end),{force});
  if(!r.ok){if(r.error==='backoff')break;lastErr={state:'fehler',msg:r.error+(r.detail?' – '+r.detail:'')};break}
  const raw=JSON.stringify(r.json).slice(0,300),p=A.parseFrankfurterSeries(r.json);if(!p.ok){lastErr={state:'abgelehnt',msg:p.detail,raw};break}
  const cur=S.ser.fx,m=new Map((cur?cur.rows:[]).map(x=>[x.date,x.v]));p.rows.forEach(x=>m.set(x.date,x.v));tot+=p.rows.length;
  S.ser.fx={cur:'USD',src:'Frankfurter v2 (Tageskurse)',kind:'Tageskurs; Wochenendwerte Methodik ungeklärt',at:Date.now(),rows:[...m].map(([date,v])=>({date,v})).sort((a,b)=>a.date<b.date?-1:1)};serDirty=true;
  if(end>=to)break;const nx=new Date(end+'T00:00:00Z');nx.setUTCDate(nx.getUTCDate()+1);from=nx.toISOString().slice(0,10)}
 const fr=S.ser.fx;if(tot){S.ilog.push({t:Date.now(),target:'EUR/USD',src:'Frankfurter v2',n:tot,from:fr.rows[0].date,to:fr.rows[fr.rows.length-1].date,note:n+' Abrufe'+(lastErr?'; Teilergebnis: '+lastErr.msg:'')})}
 if(lastErr){st('fxh',Object.assign({},lastErr,tot?{state:'teilweise'}:{}));return[tot?1:0,tot?null:'EUR/USD-Historie']}
 st('fxh',{state:'ok',okAt:Date.now(),msg:(fr?fr.rows.length:0)+' Werte '+(fr?fr.rows[0].date+' bis '+fr.rows[fr.rows.length-1].date:'')});return[1,null]}
async function refresh(force){if(refresh.busy)return;refresh.busy=1;const cfg=SRC['gold-api'];let ok=0,err=[];
 const fail=(k,label,e)=>{st(k,{state:'fehler',msg:'Programmfehler: '+(e&&e.message)});err.push(label)};
 try{
 const rsafe=()=>{if(!['INPUT','SELECT','TEXTAREA'].includes((document.activeElement||{}).tagName))render(true)};
 try{if(due('fx',36e5,force)){const r=await F.fetchJson('fx',SRC['frankfurter-v2'].url,{force});
  if(r.ok){const raw=JSON.stringify(r.json).slice(0,300),p=A.parseFrankfurter(r.json);if(p.ok){S.fx={rate:p.rate,asOf:Date.parse(p.date+'T00:00:00Z'),retrievedAt:Date.now(),source:'Frankfurter',staleMs:5*864e5,refDate:p.date};st('fx',{state:'ok',okAt:Date.now(),raw});ok++}else{st('fx',{state:'abgelehnt',msg:p.detail,raw});err.push('EUR/USD')}}
  else if(r.error!=='backoff'){st('fx',{state:'fehler',msg:r.error+(r.detail?' – '+r.detail:'')});err.push('EUR/USD')}}}catch(e){fail('fx','EUR/USD',e)}
 for(const [id,,sym] of M){try{
  if(id==='cu'){st('cu',{state:'gesperrt',msg:'Einheit nicht belegbar – nur manuell/CSV'});continue}
  const r=await F.fetchJson(sym,cfg.baseUrl.replace('{symbol}',sym),{force});
