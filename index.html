<header><h1><b>SMZ</b> Edelmetall</h1></header><main id="v" tabindex="-1"></main><nav id="nav" aria-label="Hauptnavigation"></nav><div id="toast" role="status" aria-live="polite"></div>
<script>/* SMZ Edelmetall – mathematischer Kern V1 (Phase B). Keine UI, keine Netzwerkzugriffe. */
(function (root) {
  'use strict';
  const G_PER_OZ = 31.1034768, G_PER_KG = 1000, G_PER_T = 1e6, G_PER_LB = 453.59237;
  const UNIT_G = { g: 1, kg: G_PER_KG, oz: G_PER_OZ, t: G_PER_T, lb: G_PER_LB };
  const clamp = x => Math.min(1, Math.max(0, x));
  const toGrams = (v, u) => { if (!(u in UNIT_G)) throw new Error('Unbekannte Einheit: ' + u); return v * UNIT_G[u]; };
  const pricePerGram = (price, unit) => price / UNIT_G[unit];
  // Quotierung: USD je EUR  =>  EUR = USD / (USD je EUR)
  const usdToEur = (usd, usdPerEur) => { if (!(usdPerEur > 0)) throw new Error('Ungültiger FX'); return usd / usdPerEur; };

  // Midrank-Perzentil (0..1): (#kleiner + 0,5·#gleich)/N
  function midrank(series, x) {
    let lt = 0, eq = 0;
    for (const v of series) { if (v < x) lt++; else if (v === x) eq++; }
    return (lt + 0.5 * eq) / series.length;
  }
  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
  const ma = (a, n) => a.length >= n ? mean(a.slice(-n)) : null;

  // Gold-Silber-Ratio; Paare nur bei gleicher Währung und Zeitabweichung <= maxMs
  function ratio(gold, silver, maxMs = 36e5) {
    if (gold.currency !== silver.currency) return { value: null, reason: 'Währungen verschieden' };
    if (Math.abs(gold.asOf - silver.asOf) > maxMs) return { value: null, reason: 'Kurse nicht synchron' };
    return { value: gold.pricePerOz / silver.pricePerOz };
  }
  const ratioDeviation = (r, avg) => (r / avg - 1);
  function ratioCategory(pct, nPairs, coverage) {
    if (nPairs < 250 || coverage < 0.8) return null;
    const p = pct * 100;
    if (p < 20) return 'Gold deutlich relativ günstiger';
    if (p < 40) return 'Gold relativ günstiger';
    if (p <= 60) return 'Historisch eher neutral';
    if (p <= 80) return 'Silber relativ günstiger';
    return 'Silber deutlich relativ günstiger';
  }

  // Scorefaktoren (K = Kauf, V = 100-K, außer Perzentil/Kosten wie im Pflichtenheft 2.2)
  const W = { pct: .30, ma: .20, range: .15, fx: .10, mom: .15, cost: .10 };
  function scores(o) {
    // o: {prices[], fxSeries[]|null, currency:'EUR'|'USD', buyPremium|null, sellDiscount|null, stale}
    const p = o.prices, cur = p[p.length - 1], f = {}, why = [];
    if (o.stale) return { total: null, reason: 'Kurs veraltet' };
    const P = midrank(p, cur);
    const ma50 = ma(p, 50), ma200 = ma(p, 200);
    const mn = Math.min(...p), mx = Math.max(...p);
    const r = n => p.length > n ? cur / p[p.length - 1 - n] - 1 : null;
    const r21 = r(21), r126 = r(126);
    f.pct = { K: 100 * (1 - P), V: 100 * P };
    if (ma50 !== null && ma200 !== null) { const k = 50 - 25 * Math.tanh((cur / ma50 - 1) / .10) - 25 * Math.tanh((cur / ma200 - 1) / .20); f.ma = { K: k, V: 100 - k }; }
    { const k = mx === mn ? 50 : 100 * clamp(1 - (cur - mn) / (mx - mn)); f.range = { K: k, V: 100 - k }; if (mx === mn) why.push('Hoch=Tief: neutral'); }
    if (o.currency === 'EUR' && o.fxSeries) { const k = 100 * midrank(o.fxSeries, o.fxSeries[o.fxSeries.length - 1]); f.fx = { K: k, V: 100 - k }; }
    else if (o.currency === 'USD') f.fx = { K: 50, V: 50 };
    if (r21 !== null && r126 !== null) { const k = 50 - 25 * Math.tanh(r21 / .10) - 25 * Math.tanh(r126 / .25); f.mom = { K: k, V: 100 - k }; }
    if (o.buyPremium != null && o.sellDiscount != null) f.cost = { K: 100 * clamp(1 - Math.max(0, o.buyPremium) / .30), V: 100 * clamp(1 - Math.max(0, o.sellDiscount) / .30) };
    const must = ['pct', 'ma', 'range', 'mom'].filter(k => !f[k]);
    const wSum = Object.keys(f).reduce((s, k) => s + W[k], 0);
    if (must.length || wSum < .8) return { total: null, factors: f, reason: 'Pflichtfaktoren fehlen: ' + must.join(',') };
    let K = 0, V = 0, w = {};
    for (const k in f) { K += W[k] * f[k].K; V += W[k] * f[k].V; w[k] = W[k] / wSum; }
    return { total: { K: K / wSum, V: V / wSum }, factors: f, weights: w, notes: why };
  }

  // Lots: Integer-Cent-Kostenbasis, Gramm mit 8 Nachkommastellen; Restbestand-Reste gehen auf die letzte Buchung
  const q8 = x => Math.round(x * 1e8) / 1e8;
  function newLot(id, depot, metal, grossG, fineness, costCents, date) {
    const fine = q8(grossG * fineness);
    return { id, depot, metal, fine, costCents, date, origin: id, sold: [], };
  }
  function sell(lot, soldFine, netProceedsCents) {
    if (soldFine > lot.fine + 1e-9) throw new Error('Verkauf über Restbestand');
    const full = Math.abs(soldFine - lot.fine) < 1e-9;
    const alloc = full ? lot.costCents : Math.round(lot.costCents * (soldFine / lot.fine));
    lot.fine = full ? 0 : q8(lot.fine - soldFine);
    lot.costCents -= alloc;
    return { allocCostCents: alloc, realizedCents: netProceedsCents - alloc };
  }
  function transfer(lot, fineG, toDepot, newId) {
    if (fineG > lot.fine + 1e-9) throw new Error('Transfer über Restbestand');
    const full = Math.abs(fineG - lot.fine) < 1e-9;
    const cost = full ? lot.costCents : Math.round(lot.costCents * (fineG / lot.fine));
    const moved = { ...lot, id: newId, depot: toDepot, fine: q8(fineG), costCents: cost, sold: [] }; // origin/date erhalten
    lot.fine = full ? 0 : q8(lot.fine - fineG); lot.costCents -= cost;
    return moved;
  }

  // Simulator: Attribution Metall → FX → Kosten (Summe = Gesamtergebnis)
  function simulate(s) {
    // s: fineG, buySpotUsd/g(inkl. nichts), buyFx, buyPremium, buyFixedEur, sellSpotUsd/g, sellFx, sellDiscount, sellFeeEur, inflation, years
    const buyUsd = s.fineG * s.buySpotUsdG, buyEurRef = usdToEur(buyUsd, s.buyFx);
    const buyTotal = buyEurRef * (1 + s.buyPremium) + s.buyFixedEur;
    const sellGrossEur = usdToEur(s.fineG * s.sellSpotUsdG * (1 - s.sellDiscount), s.sellFx);
    const sellNet = sellGrossEur - s.sellFeeEur;
    const profit = sellNet - buyTotal, ret = buyTotal > 0 ? profit / buyTotal : null;
    const metalEffect = usdToEur(s.fineG * s.sellSpotUsdG, s.buyFx) - buyEurRef;
    const fxEffect = usdToEur(s.fineG * s.sellSpotUsdG, s.sellFx) - usdToEur(s.fineG * s.sellSpotUsdG, s.buyFx);
    const costEffect = profit - metalEffect - fxEffect; // alle Kosten/Abschläge, Rest exakt
    const real = ret === null || s.inflation <= -1 ? null : (1 + ret) / Math.pow(1 + s.inflation, s.years) - 1;
    // Break-even-Spot (USD/g): sellNet = buyTotal
    const be = ((buyTotal + s.sellFeeEur) * s.sellFx) / (s.fineG * (1 - s.sellDiscount));
    return { buyTotal, sellNet, profit, ret, real, attribution: { metalEffect, fxEffect, costEffect }, breakEvenSpotUsdG: be, warnNegative: sellNet < 0 };
  }

  // Alarm-Zustandsautomat (Schwelle über/unter), einmalig pro beobachtetem Übertritt
  function makeAlarm(dir, threshold) { return { dir, threshold, state: 'init', last: null }; }
  function alarmStep(a, value, stale) {
    if (stale || value == null) return false;
    const cond = a.dir === 'above' ? value > a.threshold : value < a.threshold;
    let fired = false;
    if (a.state === 'init') a.state = cond ? 'ausgelöst-initial' : 'scharf'; // kein Trigger beim Erstellen
    else if (a.state === 'scharf' && cond) { a.state = 'ausgelöst'; fired = true; }
    else if ((a.state === 'ausgelöst' || a.state === 'ausgelöst-initial') && !cond) a.state = 'scharf';
    return fired;
  }


  // ---------- Phase B2: Datenqualität, Paarung, Mindestdaten, TWR, 24h-Fenster ----------
  // Serien: [{date:'YYYY-MM-DD', v:Number, quoteType?:String}] – nur echte Beobachtungen, nie interpoliert.
  const isWeekend = d => { const w = new Date(d + 'T00:00:00Z').getUTCDay(); return w === 0 || w === 6; };
  // Referenz-Handelstage = Vereinigung der Datumswerte geprüfter Serien ohne Wochenenden (Feiertage: nur was Quellen liefern)
  function referenceDays(...seriesList) {
    const set = new Set();
    for (const s of seriesList) for (const o of s) if (!isWeekend(o.date)) set.add(o.date);
    return [...set].sort();
  }
  function windowSeries(series, endDate, years) {
    const e = new Date(endDate + 'T00:00:00Z'); const st = new Date(e); st.setUTCFullYear(e.getUTCFullYear() - years);
    const a = st.toISOString().slice(0, 10);
    return series.filter(o => o.date > a && o.date <= endDate);
  }
  // Lücken: Wochentage ohne Beobachtung zwischen erstem und letztem Datum (werden gemeldet, nie gefüllt)
  function findGaps(series) {
    if (series.length < 2) return [];
    const have = new Set(series.map(o => o.date)), out = [];
    const d = new Date(series[0].date + 'T00:00:00Z'), end = new Date(series[series.length - 1].date + 'T00:00:00Z');
    for (; d <= end; d.setUTCDate(d.getUTCDate() + 1)) { const k = d.toISOString().slice(0, 10); if (!isWeekend(k) && !have.has(k)) out.push(k); }
    return out;
  }
  function pairSeries(a, b) {
    const mb = new Map(b.map(o => [o.date, o.v])), out = [];
    for (const o of a) if (mb.has(o.date)) out.push({ date: o.date, a: o.v, b: mb.get(o.date) });
    return out;
  }
  // Sprünge markieren, NICHT löschen
  function flagJumps(series, thr = 0.2) {
    const f = []; for (let i = 1; i < series.length; i++) { const r = series[i].v / series[i - 1].v - 1; if (Math.abs(r) > thr) f.push({ date: series[i].date, change: r }); } return f;
  }
  function checkMinData(series, refDays, opt = {}) {
    const minN = opt.minN || 252, minCov = opt.minCov || 0.8;
    const ref = new Set(refDays), n = series.length;
    const hit = series.filter(o => ref.has(o.date)).length;
    const coverage = refDays.length ? hit / refDays.length : 0;
    const types = new Set(series.map(o => o.quoteType || 'unbekannt'));
    const reasons = [];
    if (n < minN) reasons.push(`Nur ${n} gültige Tageswerte (min. ${minN})`);
    if (coverage < minCov) reasons.push(`Abdeckung ${(coverage * 100).toFixed(1)} % (min. ${minCov * 100} %)`);
    if (types.size > 1) reasons.push('Vermischte Kursarten: ' + [...types].join(', '));
    return { ok: reasons.length === 0, n, coverage, reasons };
  }
  // Gesamtscore aus datierten Serien (EUR: FX nur auf gemeinsamen Tagen, sonst Sperre)
  function scoreSeries(o) {
    const q = checkMinData(o.series, o.refDays, o.opt);
    if (!q.ok) return { total: null, reason: q.reasons.join('; '), quality: q };
    let fxVals = null;
    if (o.currency === 'EUR') {
      if (!o.fxSeries) return { total: null, reason: 'FX-Reihe fehlt', quality: q };
      const pr = pairSeries(o.series, o.fxSeries);
      if (pr.length / o.series.length < 0.8) return { total: null, reason: 'FX nicht synchron zu Metallreihe', quality: q };
      fxVals = pr.map(x => x.b);
    }
    const r = scores({ prices: o.series.map(x => x.v), fxSeries: fxVals, currency: o.currency, buyPremium: o.buyPremium, sellDiscount: o.sellDiscount, stale: o.stale });
    r.quality = q; return r;
  }
  // TWR: periods = [{vStart (nach vorherigem Cashflow), vEnd (vor nächstem Cashflow)}]; fehlt eine Grenzbewertung -> nicht berechenbar
  function twr(periods) {
    if (!periods || !periods.length) return { value: null, reason: 'nicht berechenbar: keine Teilperioden' };
    let prod = 1;
    for (const p of periods) {
      if (!Number.isFinite(p.vStart) || !Number.isFinite(p.vEnd) || p.vStart <= 0) return { value: null, reason: 'nicht berechenbar: Grenzbewertung fehlt' };
      prod *= p.vEnd / p.vStart;
    }
    return { value: prod - 1 };
  }
  // 24h-Änderung nur mit zeitlich passendem Vergleichskurs (Toleranz tolMs um now-24h)
  function change24h(hist, nowMs, price, tolMs = 3 * 36e5) {
    const target = nowMs - 864e5; let best = null;
    for (const h of hist) { const d = Math.abs(h.t - target); if (d <= tolMs && (!best || d < best.d)) best = { d, v: h.v }; }
    return best ? price / best.v - 1 : null;
  }

  const api = { referenceDays, windowSeries, findGaps, pairSeries, flagJumps, checkMinData, scoreSeries, twr, change24h, isWeekend, G_PER_OZ, G_PER_KG, G_PER_T, G_PER_LB, toGrams, pricePerGram, usdToEur, midrank, ma, ratio, ratioDeviation, ratioCategory, scores, newLot, sell, transfer, simulate, makeAlarm, alarmStep, W };
  if (typeof module !== 'undefined') module.exports = api; else root.SMZCore = api;
})(typeof self !== 'undefined' ? self : this);
</script><script>/* SMZ Edelmetall – Datenadapter (Phase A). Alle Provider-Mappings sind UNGEPRÜFT, bis probe-sources.mjs / die In-App-Prüfung
   echte Antworten bestätigt hat. Ohne gültiges Mapping liefert der Adapter einen Fehler statt Werte zu raten. */
(function (root) {
  'use strict';
  const get = (o, path) => path.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o);
  const ERR = { OFFLINE: 'offline', CORS: 'cors_oder_netz', RATE: 'rate_limit', KEY: 'api_key_ungueltig', HTTP: 'http_fehler', INCOMPAT: 'quelle_inkompatibel', NOCFG: 'nicht_konfiguriert', BACKOFF: 'backoff' };

  // cfg: {provider, instrument, quoteType, currency, unit, license, staleAfterMs, timezone, map:{price,asOf}|null, verified}
  function normalizeQuote(cfg, raw, retrievedAt) {
    if (!cfg.map) return { ok: false, error: ERR.NOCFG, detail: 'Mapping fehlt – erst Quelle real prüfen' };
    const price = Number(get(raw, cfg.map.price)), asOfRaw = get(raw, cfg.map.asOf);
    const asOf = asOfRaw == null ? NaN : Date.parse(asOfRaw);
    if (!Number.isFinite(price) || price <= 0 || !Number.isFinite(asOf)) return { ok: false, error: ERR.INCOMPAT, detail: 'Preis oder Zeitstempel nicht lesbar' };
    const flags = []; if (!cfg.verified) flags.push('mapping_ungeprueft');
    return { ok: true, quote: { provider: cfg.provider, instrument: cfg.instrument, quoteType: cfg.quoteType, price, currency: cfg.currency, unit: cfg.unit, asOf, retrievedAt, timezone: cfg.timezone || 'UTC', license: cfg.license || 'unbekannt', isStale: retrievedAt - asOf > cfg.staleAfterMs, qualityFlags: flags } };
  }

  // Fetcher: Deduplizierung laufender Anfragen, Mindestabstand, exponentieller Backoff, Fehlerklassifikation.
  function createFetcher({ fetchImpl, now = Date.now, isOnline = () => true, minIntervalMs = 60000, maxBackoffMs = 3600000 }) {
    const inflight = new Map(), state = new Map();
    async function fetchJson(key, url, opts = {}) {
      const st = state.get(key) || { fails: 0, nextOk: 0, last: 0 };
      if (inflight.has(key)) return inflight.get(key);
      if (!opts.force && now() < st.nextOk) return { ok: false, error: ERR.BACKOFF, retryAt: st.nextOk };
      if (!isOnline()) return { ok: false, error: ERR.OFFLINE };
      const p = (async () => {
        let res;
        try { res = await fetchImpl(url, { headers: opts.headers }); }
        catch (e) { return fail(st, key, ERR.CORS, 'Netzwerk-/CORS-Fehler (Browser kann beides nicht unterscheiden)'); }
        if (res.status === 429) return fail(st, key, ERR.RATE, 'Limit erreicht', res.headers && res.headers.get && res.headers.get('retry-after'));
        if ((res.status === 401 || res.status === 403) && opts.usesKey) return fail(st, key, ERR.KEY);
        if (!res.ok) return fail(st, key, ERR.HTTP, 'HTTP ' + res.status);
        if (opts.text) { let tx; try { tx = await res.text(); } catch (e) { return fail(st, key, ERR.INCOMPAT, 'Antwort nicht lesbar'); } state.set(key, { fails: 0, nextOk: now() + minIntervalMs, last: now() }); return { ok: true, text: tx }; }
        let json; try { json = await res.json(); } catch (e) { return fail(st, key, ERR.INCOMPAT, 'Antwort kein JSON'); }
        state.set(key, { fails: 0, nextOk: now() + minIntervalMs, last: now() });
        return { ok: true, json };
      })();
      inflight.set(key, p);
      try { return await p; } finally { inflight.delete(key); }
    }
    function fail(st, key, error, detail, retryAfter) {
      const fails = st.fails + 1, back = Math.min(maxBackoffMs, minIntervalMs * 2 ** fails), ra = Number(retryAfter) * 1000;
      const wait = Number.isFinite(ra) && ra > 0 ? Math.max(ra, back) : back;
      state.set(key, { fails, nextOk: now() + wait, last: now() });
      return { ok: false, error, detail, retryAt: now() + wait };
    }
    return { fetchJson, _state: state };
  }

  // Treasury/FRED-CSV: strikt, mit Spaltenangabe; Datum ISO oder MM/DD/YYYY. Keine Interpolation, ungültige Zeilen werden gemeldet.
  function parseCsvSeries(text, { dateCol, valueCol, delimiter = ',' }) {
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return { rows: [], rejected: [], error: 'leer' };
    const strip = s => s.trim().replace(/^"|"$/g, '');
    const head = lines[0].split(delimiter).map(strip), di = head.indexOf(dateCol), vi = head.indexOf(valueCol);
    if (di < 0 || vi < 0) return { rows: [], rejected: [], error: 'Spalte nicht gefunden: ' + (di < 0 ? dateCol : valueCol) };
    const rows = [], rejected = [];
    lines.slice(1).forEach((l, i) => {
      const c = l.split(delimiter).map(strip); let d = c[di];
      const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(d); if (m) d = `${m[3]}-${m[1]}-${m[2]}`;
      const m2 = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(d); if (m2) d = `${m2[3]}-${m2[2].padStart(2, '0')}-${m2[1].padStart(2, '0')}`;
      const v = Number(String(c[vi]).replace(',', '.'));

sim:()=>{const g=N('s_g'),p=x=>N(x)/100;const v={fineG:g,buySpotUsdG:N('s_bs'),buyFx:N('s_bfx'),buyPremium:p('s_bp'),buyFixedEur:N('s_bf'),sellSpotUsdG:N('s_ss'),sellFx:N('s_sfx'),sellDiscount:p('s_sd'),sellFeeEur:N('s_sf'),inflation:p('s_inf'),years:N('s_y')};
 S.simRes=Object.values(v).some(x=>!isFinite(x))||g<=0||v.buyFx<=0||v.sellFx<=0?{err:'Bitte alle Felder mit gültigen Zahlen füllen (Gewicht und EUR/USD > 0).'}:C.simulate(v)},
newdepot:()=>{const n=V('d_name').trim();if(!n)return toast('Name fehlt',1);S.depots.push({id:crypto.randomUUID(),name:n})},
buy:()=>{const g=N('p_g'),fi=N('p_f'),pr=N('p_p'),sh=N('p_s')||0,ne=N('p_n')||0,cur=V('p_c');if(!(g>0)||!(fi>0&&fi<=1)||!(pr>=0))return toast('Gewicht > 0, Feinheit 0–1 und Preis prüfen',1);let fx=null;if(cur==='USD'){fx=N('p_fx');if(!(fx>0))return toast('Für USD-Kauf historischen EUR/USD-Kurs angeben',1)}
 const tot=pr+sh+ne,cents=Math.round((cur==='USD'?C.usdToEur(tot,fx):tot)*100),l=C.newLot(crypto.randomUUID(),V('p_d'),V('p_m'),g,fi,cents,V('p_date'));Object.assign(l,{type:V('p_t'),dealer:V('p_h'),gross:g,fineness:fi,cur,orig:pr,ship:sh,extra:ne,fx,fxSrc:'manuell'});S.lots.push(l)},
sell:()=>{const l=S.lots.find(x=>x.id===V('x_l')),g=N('x_g'),e=N('x_e');if(!l||!(g>0)||!isFinite(e)||!/^\d{4}-\d{2}-\d{2}$/.test(V('x_d')))return toast('Lot, Menge, Erlös und Datum prüfen',1);if(g>l.fine+1e-9)return toast('Verkauf übersteigt Restbestand ('+nf(l.fine,4)+' g)',1);const r=C.sell(l,g,Math.round(e*100));S.sales.push({id:crypto.randomUUID(),lot:l.id,metal:l.metal,fine:g,date:V('x_d'),netCents:Math.round(e*100),allocCents:r.allocCostCents,realizedCents:r.realizedCents});toast('Verkauf gebucht: '+money(r.realizedCents/100,'EUR')+' realisiert')},
transfer:()=>{const l=S.lots.find(x=>x.id===V('tr_l')),g=N('tr_g'),d=V('tr_d');if(!l||!(g>0))return toast('Lot und Menge prüfen',1);if(d===l.depot)return toast('Quell- und Zieldepot sind gleich',1);if(g>l.fine+1e-9)return toast('Menge übersteigt Restbestand',1);S.lots.push(C.transfer(l,g,d,crypto.randomUUID()));toast('Transfer gebucht')},
manq:()=>{const p=N('m_p');if(!(p>0))return toast('Preis ungültig',1);S.q[V('m_m')]={provider:'manuell',price:p,currency:V('m_c'),unit:V('m_u'),asOf:Date.now(),retrievedAt:Date.now(),source:'manuell',flags:[]};(S.hist[V('m_m')]=S.hist[V('m_m')]||[]).push({t:Date.now(),v:p})},
manfx:()=>{const r=N('m_fx');if(!(r>0))return toast('Kurs ungültig',1);S.fx={rate:r,asOf:Date.now(),source:'manuell'}},
manrate:()=>{const k=V('r_k'),v=N('r_v');if(!isFinite(v)||!/^\d{4}-\d{2}-\d{2}$/.test(V('r_d')))return toast('Wert/Datum ungültig',1);const o=S.rates[k];S.rates[k]={v,date:V('r_d'),prev:o?o.v:null,src:'manuell'}},
file:async()=>{const fl=$('#i_f').files[0];if(!fl)return;const tx=await fl.text(),l=tx.split(/\r?\n/)[0],dl=l.includes(';')?';':l.includes('\t')?'\t':',';imp={tx,dl,h:l.split(dl).map(x=>x.trim().replace(/^"|"$/g,'')),res:null};render(true)},
prev:()=>{imp.res=A.parseCsvSeries(imp.tx,{dateCol:V('i_dc'),valueCol:V('i_vc'),delimiter:imp.dl});imp.cfg={dc:V('i_dc'),vc:V('i_vc'),cur:V('i_c'),u:V('i_u'),t:V('i_t')}},
doimp:()=>{const c=imp.cfg,t=c.t,rs=imp.res.rows;if(['fedLow','fedHigh','nom','real'].includes(t)){const n=rs.length;S.rates[t]={v:rs[n-1].v,date:rs[n-1].date,prev:n>1?rs[n-2].v:null,src:'CSV-Import'}}
 else{const isFx=t==='fx',cur=isFx?'USD':c.cur,old=S.ser[t];if(old&&old.cur!==cur)return toast('Vorhandene Reihe hat andere Währung ('+old.cur+') – gemischte Kursarten nicht erlaubt',1);const m=new Map(((old&&old.rows)||[]).map(r=>[r.date,r.v])),d=isFx?1:C.toGrams(1,c.u);rs.forEach(r=>m.set(r.date,r.v/d));S.ser[t]={cur,src:'CSV-Import',at:Date.now(),rows:[...m].map(([date,v])=>({date,v})).sort((a,b)=>a.date<b.date?-1:1)}}
 toast('Import abgeschlossen: '+rs.length+' Werte');imp=null},
newalarm:()=>{const v=N('a_v');if(!isFinite(v))return toast('Schwellenwert ungültig',1);const t=V('a_t');S.alarms.push({id:crypto.randomUUID(),type:t,metal:V('a_m'),dir:V('a_d'),thr:v,cur:V('a_c'),unit:V('a_u'),paused:false,st:C.makeAlarm(V('a_d'),v)})},
apause:id=>{const a=S.alarms.find(x=>x.id===id);a.paused=!a.paused;if(!a.paused)a.st=C.makeAlarm(a.dir,a.thr)},adel:id=>{S.alarms=S.alarms.filter(x=>x.id!==id)},clrhist:()=>{S.ahist=[]},
notif:async()=>{if(!('Notification'in window))return toast('Benachrichtigungen werden hier nicht unterstützt',1);const r=await Notification.requestPermission();toast(r==='granted'?'Erlaubt (nur bei geöffneter App)':'Berechtigung verweigert',r!=='granted')},
saveprof:()=>{for(const m of M){const b=parseFloat(V('pb_'+m[0]).replace(',','.')),s=parseFloat(V('ps_'+m[0]).replace(',','.'));S.prof[m[0]]={buy:isFinite(b)?b:null,sell:isFinite(s)?s:null}}toast('Gespeichert')},
modt:v=>{const h=S.cfg.hide,i=h.indexOf(v);i<0?h.push(v):h.splice(i,1)},modu:v=>{v=+v;const o=S.cfg.order;if(v>0)[o[v-1],o[v]]=[o[v],o[v-1]]},modd:v=>{v=+v;const o=S.cfg.order;if(v<o.length-1)[o[v+1],o[v]]=[o[v],o[v+1]]},
savetheme:()=>{S.cfg.theme=V('t_t');theme()},
probe:async()=>{toast('Prüfe Quellen …');for(const [n,u] of PROBES){const r={at:Date.now()};try{const x=await fetch(u,{cache:'no-store'}),tx=await x.text();Object.assign(r,{ok:true,status:x.status,ct:x.headers.get('content-type'),head:tx.slice(0,600)})}catch(e){r.ok=false;r.err='Blockiert oder unerreichbar (CORS, offline oder DNS – der Browser unterscheidet das nicht) ['+e.name+': '+e.message+']'}S.probe[n]=r;sub==='src'&&render()}},
copyprobe:()=>navigator.clipboard.writeText(JSON.stringify({env:{proto:location.protocol,origin:location.origin,secure:window.isSecureContext,idb:dbOk,ua:navigator.userAgent,at:new Date().toISOString()},probe:S.probe},null,1)).then(()=>toast('Bericht kopiert'),()=>toast('Kopieren nicht erlaubt',1))};
const NOSAVE=['cur','unit','per','area','back','open','sub','refresh','csvx','file','prev','probe','copyprobe','notif','sim'];
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t||t.type==='checkbox'||t.type==='file')return;await run(t)});
document.addEventListener('change',async e=>{const t=e.target.closest('[data-a]');if(t&&(t.type==='checkbox'||t.type==='file'))await run(t)});
async function run(t){const a=t.dataset.a;try{await ACT[a](t.dataset.v)}catch(err){toast('Fehler: '+err.message,1)}if(!['refresh','probe','file'].includes(a)){checkAlarms();render(!['sub','open','back'].includes(a));if(!NOSAVE.includes(a)||['cur','unit'].includes(a))await save()}}
function render(keep){const kv={};if(keep)document.querySelectorAll('#v input:not([type=file]):not([type=checkbox]),#v select').forEach(e=>{if(e.id)kv[e.id]=e.value});const T=[['start','Start','◈'],['markets','Märkte','⌇'],['sim','Simulator','∑'],['depot','Depot','▣'],['more','Mehr','⋯']];$('#nav').innerHTML=T.map(x=>`<button data-t=${x[0]} ${tab===x[0]?'aria-current=page':''}><span aria-hidden=true>${x[2]}</span>${x[1]}</button>`).join('');
 const sc=scrollY;$('#v').innerHTML=({start:vStart,markets:vMarkets,sim:vSim,depot:vDepot,more:vMore})[tab]();for(const id in kv){const el=document.getElementById(id);if(el&&!(el.tagName==='SELECT'&&![...el.options].some(o=>o.value===kv[id])))el.value=kv[id]}scrollTo(0,sc)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;if(tab===b.dataset.t&&b.dataset.t==='markets')sel=null;if(b.dataset.t!=='more')sub=null;tab=b.dataset.t;render();scrollTo(0,0)});
function theme(){const d=S.cfg.theme==='auto'?matchMedia('(prefers-color-scheme: dark)').matches:S.cfg.theme==='dark';document.documentElement.dataset.theme=d?'dark':'light'}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.cfg.auto&&Date.now()-lastRef>6e4)refresh(false)});setInterval(()=>{if(!document.hidden&&S.cfg.auto&&Date.now()-lastRef>9e5)refresh(false)},6e4);
load().then(()=>{theme();render();if(!dbOk)toast('Dauerhafter Speicher nicht verfügbar (z. B. file:// oder Privatmodus). Daten gehen beim Schließen verloren.',1);if(S.cfg.auto)refresh(false)});
</script>
</body></html>
